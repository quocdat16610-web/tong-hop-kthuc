name: Build ứng dụng

# Mỗi lần push: chạy test và đóng gói app (Flutter, không dùng web) cho Windows (.exe) và Android (.apk).
# File cài đặt được đưa lên trang Releases: bản "ban-moi-nhat" (mỗi lần push) hoặc theo tag v1.2.3.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.1-12.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-14.2.0-mingw-w64ucrt-12.0.0-r2.zip
  WINLIBS_SHA256: D41933CEF13113018418D7B596319C2ED59A567395BBB87AFE27A171E111D553

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=GIT_SHA=${{ github.sha }} --dart-define=APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
      - run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p ../dist && cp build/app/outputs/flutter-apk/app-release.apk "../dist/SoTayDSA-$V-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - shell: bash
        run: flutter build windows --release --dart-define=GIT_SHA=${{ github.sha }} --dart-define=APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
      - name: Tải trình biên dịch g++ và gdb (MinGW-w64 / WinLibs) để đóng gói kèm
        shell: pwsh
        run: |
          Invoke-WebRequest $env:WINLIBS_URL -OutFile winlibs.zip
          $hash = (Get-FileHash winlibs.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:WINLIBS_SHA256) { throw "Sai checksum: $hash" }
          7z x winlibs.zip -owinlibs-tmp -y | Out-Null
          $m = 'build/windows/x64/runner/Release/mingw64'
          Move-Item winlibs-tmp/mingw64 $m
          # Bỏ những thứ không cần cho việc biên dịch / gỡ lỗi C++ để bộ cài nhỏ hơn (giữ gdb và Python của gdb).
          Remove-Item -Recurse -Force "$m/share/doc", "$m/share/man", "$m/share/info", "$m/share/locale" -ErrorAction SilentlyContinue
          Remove-Item -Force "$m/lib/libpython3.9.a" -ErrorAction SilentlyContinue
          $gccLibexec = Get-ChildItem "$m/libexec/gcc/x86_64-w64-mingw32" | Select-Object -First 1
          Remove-Item -Force (Join-Path $gccLibexec.FullName 'cc1obj.exe'), (Join-Path $gccLibexec.FullName 'cc1objplus.exe'), (Join-Path $gccLibexec.FullName 'f951.exe')
          $drop = 'lto-dump','doxygen','ctest','cpack','cmake','cmcldeps','cppcheck','gfortran','x86_64-w64-mingw32-gfortran','ctags','optscript','readtags','nasm','ndisasm','yasm','vsyasm','ytasm','ccache','ninja'
          foreach ($n in $drop) { Remove-Item -Force -ErrorAction SilentlyContinue "$m/bin/$n.exe" }
          "{0:N0} MB" -f ((Get-ChildItem $m -Recurse | Measure-Object Length -Sum).Sum / 1MB)
      - name: Chép thư viện Visual C++ để app chạy trên máy chưa cài VC++ Redistributable
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') { Copy-Item "C:\Windows\System32\$d" build/windows/x64/runner/Release/ }
      - name: Kiểm thử chấm bài, chạy tương tác và gỡ lỗi với g++/gdb đi kèm
        shell: pwsh
        run: |
          $env:PATH = "$PWD\build\windows\x64\runner\Release\mingw64\bin;$env:PATH"
          g++ --version
          gdb --version
          flutter test
      - name: Đóng gói bộ cài .exe và bản portable .zip
        shell: pwsh
        run: |
          $v = ((Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace 'version:\s*','' -replace '\+.*','')
          New-Item -ItemType Directory -Force ../dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/O$PWD\..\dist" windows/installer/SoTayDSA.iss
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../dist/SoTayDSA-$v-win-x64-portable.zip"
          Get-ChildItem ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  # Đưa file cài đặt lên trang Releases để tải trực tiếp (.exe, .apk), không cần giải nén artifact.
  release:
    if: github.event_name == 'push'
    needs: [android, windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Gom thư viện nội dung (content/*.dsanote.json → noi-dung.json)
        run: python3 app/tool/build_library.py out/noi-dung.json
      - name: Tạo / cập nhật Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          cat > notes.md <<NOTES
          Ứng dụng chạy trực tiếp (không phải website). Tải file phù hợp:
          - **Windows**: \`SoTayDSA-Setup-*.exe\` (bộ cài, có sẵn g++ và gdb) hoặc \`SoTayDSA-*-win-x64-portable.zip\` (giải nén rồi chạy \`SoTayDSA.exe\`)
          - **Android**: \`SoTayDSA-*-android.apk\` (code C++ được biên dịch online, cần Internet)

          App tự kiểm tra bản mới và tự nhận nội dung bài tập mới (\`noi-dung.json\`, gom từ thư mục content/).

          Commit: ${GITHUB_SHA}
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "Sổ tay DSA C++ $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release delete ban-moi-nhat --yes --cleanup-tag || true
            gh release create ban-moi-nhat out/* --prerelease --target "$GITHUB_SHA" --title "Bản mới nhất (${GITHUB_REF_NAME})" --notes-file notes.md
          fi
